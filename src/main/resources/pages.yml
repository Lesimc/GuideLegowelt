  warps:
    title: "Warps"
    summary: "Travel through persistent linked gates within or across servers."
    content:
      - "A <page:warps>Warp</page> contains two linked gates. Entering an enabled gate sends supported players or passive entities to the other side."
      - "Player warp tickets can be used on the Survival or Tech server in their overworld or nether. Tickets must be unstacked."
      - "New and moved gates cannot intersect another warp. In the Survival overworld, normal tickets cannot be used within 500 blocks of spawn."
      - "Stand and look in the desired travel direction before using a ticket; gate direction is rounded to 45-degree steps."
      - "Choose a <page:spawn-warp/>, <page:anywhere-warp/>, or <page:system-warp/> below."
      - "<page:custom-potions>Return Potions</page> use a private one-use warp to return to a Mining Server location."
  spawn-warp:
    parent: "warps"
    title: "Spawn Warp"
    summary: "Connect one private base gate to an assigned spawn chamber."
    content:
      - "A <page:spawn-warp/> connects your chosen location to an automatically assigned chamber at Survival spawn."
      - "Each player can own one Spawn Warp. Creation fails when no spawn chamber is available."
      - "Creating the warp consumes the Spawn Warp ticket and gives you a chamber-move ticket."
      - "A normal Move Warp ticket can move the base side. A chamber-move ticket moves the spawn side to an empty spawn chamber."
      - "Ticket prices are configured by server staff."
      - "See <page:warps/> for shared placement restrictions."
  anywhere-warp:
    parent: "warps"
    title: "Anywhere Warp"
    summary: "Create a named two-way warp between two valid locations."
    content:
      - "Right-click an unstacked Anywhere Warp ticket at the first location, then at the second location. Use the anvil screen to name the completed warp."
      - "Left-clicking before completion resets the locations stored on the ticket."
      - "There is no per-player limit on named Anywhere Warps."
      - "<b>Valid locations:</b> Survival or Tech overworld and nether locations outside the Survival spawn exclusion area that do not intersect another warp."
      - "Anywhere Warps cannot be created in End worlds or unsupported server types."
      - "To move one side, activate a Move Warp ticket, walk into the gate to select that side, then use the ticket at its new location."
      - "Ticket prices and build permissions are configured by server staff."
      - "See <page:warps/> for shared placement rules."
  system-warp:
    parent: "warps"
    title: "System Warp"
    summary: "Staff-managed global or infrastructure warps."
    content:
      - "<page:system-warp>System Warps</page> are created and maintained with staff-only warp commands."
      - "Global warps use a shared system owner rather than a player account."
      - "Staff can configure each side position, enabled state, permission, server, world, and visual particle settings."
      - "System Warp availability and destinations are live server configuration rather than player-purchased tickets."
      - "See <page:warps/> for normal player warp behavior."
  features:
    title: "Features"
    summary: "Browse LegoWelt gameplay systems and quality-of-life tools."
    content:
      - "Select a feature below for behavior and usage details."
      - "The major systems also have dedicated guides for <page:augments/> and <page:warps/>."
      - "Server-specific availability is summarized on the <page:survival-server/> and <page:mining-server/> pages."
      - "Other utilities include <page:map-copyright/>."
  openable-shulkers:
    parent: "features"
    title: "Openable Shulker Boxes"
    summary: "Use the server shulker integration without placing boxes."
    content:
      - "Inventory shulker opening and cycling are provided by the server's shulker integration."
      - "Open a shulker from your inventory or by right-clicking while holding it, without placing the box in the world."
      - "Cycle between accessible shulker boxes without closing the inventory screen."
      - "LegoWelt adds <page:shulker-storage/> that use the same inventory integration."
  shulker-storage:
    parent: "augments"
    title: "Shulker Storage Augments"
    summary: "Automate pickup, block restocking, disposal, and nested storage."
    content:
      - "Five shulker augments currently exist: <page:augment-expansion>Expansion</page>, <page:augment-bag-of-holding>Bag of Holding</page>, <page:augment-cactus-storage>Cactus Storage</page>, <page:augment-collector>Collector</page>, and <page:augment-restocker>Restocker</page>."
      - "Each applies to shulker boxes. These Rare augments have effectively unlimited durability."
      - "Collector, Restocker, and Cactus Storage scan augmented shulkers nested inside a Bag of Holding."
      - "See <page:openable-shulkers>Openable Shulkers</page>, <page:augments/>, and <page:custom-crafting/>."
  augment-expansion:
    parent: "shulker-storage"
    title: "Augment: Expansion"
    summary: "Adds extra inventory rows to a shulker box."
    content:
      - "<bold><underlined><bold><underlined>Applies to:</underlined></bold></underlined></bold> Shulker boxes."
      - "Effect: Adds one storage row per augment level."
      - "Bag of Holding smithing can add Expansion levels to the wearable bag. See <page:augment-bag-of-holding>Bag of Holding</page> and <page:custom-crafting/>."
  augment-bag-of-holding:
    parent: "shulker-storage"
    title: "Augment: Bag of Holding"
    summary: "Creates a wearable gliding shulker that permits nested shulkers."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Shulker boxes. \n"
      - "Can only be created by crafting it."
      - "<bold><underlined>Effect:</underlined></bold> Permits shulker boxes inside the bag and lets storage augments scan those nested boxes."
      - "The bag is wearable as a glider, cannot be placed or dispensed, and only one Bag of Holding may be carried or held on the cursor at a time."
      - "It can also be upgraded with <page:augment-expansion>Expansion</page> up to level 3."
      - "See <page:custom-crafting/> for the smithing recipe."
  augment-cactus-storage:
    parent: "shulker-storage"
    title: "Augment: Cactus Storage"
    summary: "Destroys incoming items that already have a matching sample in the shulker."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Shulker boxes."
      - "<bold><underlined>Effect:</underlined></bold> Destroys a picked-up or Telepathy-routed item when this shulker already contains at least one matching item."
      - "Cactus Storage is processed before <page:augment-collector>Collector</page>, including in nested shulkers."
  augment-collector:
    parent: "shulker-storage"
    title: "Augment: Collector"
    summary: "Routes matching incoming items into a shulker."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Shulker boxes."
      - "<bold><underlined>Effect:</underlined></bold> Sends picked-up or <page:augment-telepathy>Telepathy</page>-routed items into this shulker when it already contains at least one matching item."
      - "Items that do not match or do not fit continue to later Collector shulkers or the normal player inventory."
      - "See <page:custom-crafting/>."
  augment-restocker:
    parent: "shulker-storage"
    title: "Augment: Restocker"
    summary: "Refills matching player-inventory stacks from a shulker."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Shulker boxes."
      - "<bold><underlined>Effect:</underlined></bold> When an inventory stack shrinks or empties, pulls similar items from Restocker shulkers back into the same slot."
      - "<page:augment-replant>Replant</page> can also take one matching seed or crop directly from Restocker storage."
      - "See <page:custom-crafting/>."
  custom-loot-tables:
    parent: "features"
    title: "Custom Loot Tables"
    summary: "Generate server-defined rewards from untouched loot containers."
    content:
      - "Untouched lootable block and entity containers on the <page:survival-server/>, <page:mining-server/>, and Tech server are handled as <page:shared-loot/>."
      - "Exact rewards come from server loot tables and may change independently."
      - "<page:loot-crate/> and augment traders use dedicated server loot tables."
      - "Custom travel items are described on the <page:custom-potions/> page."
  shared-loot:
    parent: "features"
    title: "Personal Loot"
    summary: "Give each player separate timed loot from one container."
    content:
      - "The first interaction with an untouched loot-table container starts a 20-minute <page:shared-loot/> session."
      - "Each player receives a separate inventory generated from the same table. The inventory title shows the remaining minutes."
      - "Items can be removed but cannot be deposited into the personal-loot inventory."
      - "When the session starts, exactly two players within 128 blocks give the container a 20% chance to generate its table twice. Three or more give it a 25% chance."
      - "Breaking the block container or destroying an active lootable vehicle drops outstanding active personal inventories at that location."
      - "Personal Loot runs on the <page:survival-server>Survival</page>, <page:mining-server>Mining</page>, and Tech server types."
  loot-crate:
    parent: "features"
    title: "Treasure Barrels"
    summary: "Reveal tiered loot barrels while directly mining blocks."
    content:
      - "Directly breaking an unaltered block on the <page:mining-server/> can replace that block with an upward-facing <page:loot-crate>Treasure Barrel</page>."
      - "The four tiers are Common, Rare, Epic, and Legendary. Each tier uses a separate server loot table and sound; Legendary finds are announced."
      - "Diamond ore, emerald ore, and ancient debris have the highest weight. Redstone, iron, copper, coal, lapis, and nether-quartz ores also have much higher weight than ordinary blocks."
      - "Progress toward each tier accumulates while mining, with a pity threshold at three times the normal weighted chance."
      - "Barrels are not generated for the extra blocks recursively broken by <page:augment-excavate>Excavate</page>."
      - "The expected loot comes from <page:custom-loot-tables/>. See <page:feature-toggles/> for toggle status."
  custom-potions:
    parent: "features"
    title: "Custom Potions"
    summary: "Use consumable travel effects across shared-inventory servers."
    content:
      - "<b>Return Potion:</b> Used on the <page:mining-server/>. Sends you to an available chamber on Survival and creates a private one-use <page:warps>Warp</page> back to the consumed location."
      - "<b>Recall Potion:</b> Teleports you to the first-world spawn of the current server."
      - "<b>Wormhole Potion:</b> Opens a list of other online players on Survival, Mining, or Tech and teleports you to the selected player, including across servers."
      - "<b>Teleport Potion:</b> Used on Mining. Chooses a random X/Z within 25 million blocks, moves you above the highest block, then grants Fire Resistance and Water Breathing for 60 seconds plus Resistance V for 10 seconds."
      - "<b>Resurgence Potion:</b> Moves you above the highest block at a random X/Z within 1,000 blocks of your last valid death location and grants the same protection effects."
      - "<b>Group Return Potion:</b> Currently unavailable."
      - "Closing the Wormhole player list without choosing a player returns one potion to your inventory or drops it when the inventory is full."
  orientation-scrolls:
    parent: "features"
    title: "Scrolls of Orientation"
    summary: "Consume a scroll to create a compass for a nearby target."
    content:
      - "Hold an unsealed Scroll of Orientation in your main hand on the <page:mining-server/>."
      - "/locatescroll biome namespace:id searches for a registered biome within 2,500 blocks."
      - "/locatescroll structure namespace:id searches within four region files for a registered structure."
      - "Tab completion lists valid biome and structure identifiers."
      - "A successful search consumes one scroll and gives you a named lodestone compass pointing to the result. A failed search does not consume the scroll."
      - "Unseal a Sealed Scroll of Orientation by surrounding it with four Echo Shards. See <page:custom-crafting/>."
  sickles-and-farmables:
    parent: "features"
    title: "Sickles and Farmables"
    summary: "Harvest supported crops with custom tools and rarity drops."
    content:
      - "<page:sickles-and-farmables>Sickles</page> are custom hoes available in wood, stone, iron, gold, diamond, and netherite tiers."
      - "Harvesting a supported crop with a sickle replaces one normal drop with an Uncommon farmable. Each valid harvest has a 1 in 128 chance to produce Rare instead; that success has a 1 in 64 chance to become Epic."
      - "Ageable crops must be fully grown. Supported crops are wheat, potatoes, carrots, beetroot, melons, pumpkins, sweet berries, cactus, cactus flowers, sugar cane, bamboo, nether wart, torchflowers, pitcher plants, and cocoa."
      - "A matching Farmer augment improves the rare-drop chance and can multiply normal drops. These self augments support levels 1 through 10."
      - "The Replant augment uses one matching seed or crop from the drops, a Restocker shulker, or your inventory to replant farmland crops, nether wart, or cocoa."
      - "Related: <page:augments/>, <page:shulker-storage>Shulker Storage</page>, and <page:custom-crafting/>."
  custom-crafting:
    parent: "features"
    title: "Custom Crafting"
    summary: "Craft, compress, downgrade, upgrade, and recycle custom items."
    content:
      - "LegoWelt recipes are discovered automatically when you join."
      - "Custom recipes cover <page:sickles-and-farmables/>, <page:orientation-scrolls/>, <page:minerals/>, <page:augments/>, and <page:shulker-storage>Storage Upgrades</page>."
      - "Nine identical supported mineral or farmable items make a bag; nine matching bags make a crate. Unbagging and uncrating reverse those recipes."
      - "One Epic mineral makes 64 Rare copies. Rare or Epic farmables make 64 copies at the next lower rarity."
      - "Smelting an Augment Book returns approximately 90-110% of its remaining value as Augment Scrap. Values below one scrap can produce an Augment Particle; nine particles make one scrap."
      - "Two, four, or eight identical self-augment books increase the level by one, two, or three. Combined durability is divided by the same power of two and the result cannot exceed level 10."
      - "A Bag of Holding is smithed from its upgrade template, an elytra, and a netherite block. Repeating the process on the bag adds Expansion levels up to 3."
  map-copyright:
    parent: "features"
    title: "Map Copyright"
    summary: "Assign a filled-map owner and block unauthorized copies."
    content:
      - "With the copyright permission, hold a filled map and use /copyright to store your UUID as its owner."
      - "Use /copyright player to assign a cached player name, or provide a UUID directly."
      - "Only the stored owner or staff with the bypass permission can copy that map in a crafting table or take its copy result from a cartography table."
      - "Copyright ownership is stored on the map item."
  feature-toggles:
    parent: "features"
    title: "Optional Features"
    summary: "Inspect the per-player mineral and barrel settings."
    content:
      - "LegoWelt registers /togglefeature minerals on|off|view for <page:minerals>Mineral</page> drops."
      - "It also registers /togglefeature barrels on|off|view for <page:loot-crate>Treasure Barrel</page> generation."
      - "The command /yeet disables phantoms for the player."
  survival-server:
    parent: "getting-started"
    title: "Survival Server"
    summary: "LegoWelt systems enabled on the Survival server type."
    content:
      - "The Survival server type enables shared-inventory features such as <page:shared-loot/> and <page:custom-potions/>."
      - "Player <page:warps>Warp</page> tickets can be used in the Survival overworld and nether, subject to the spawn exclusion area and intersection checks."
      - "<page:spawn-warp>Spawn Warps</page> use chambers in the Survival spawn world. Mining Return Potions also arrive in dedicated Survival chambers."
      - "Untouched loot-table containers use <page:custom-loot-tables>Custom Loot handling</page>."
      - "Read <page:getting-started/> and the <page:server-rules/> for general network information."
  mining-server:
    parent: "getting-started"
    title: "Mining Server"
    summary: "LegoWelt systems exclusive to or enabled on Mining."
    content:
      - "The Mining server type enables pickaxe-only <page:minerals>Mineral</page> drops and block-triggered <page:loot-crate/>."
      - "Hold a scroll and use <page:orientation-scrolls/> to find registered biomes or structures."
      - "<page:custom-potions>Teleport Potions</page> choose distant random surface coordinates on Mining. Return Potions leave for Survival and create a private one-use warp back."
      - "Mining is also a shared-inventory server type, so <page:shared-loot/>, <page:custom-loot-tables>Loot-table handling</page>, and supported travel potions are active."
      - "World reset schedules, access portals, and experience-sharing policies are configured separately by server staff."
      - "See <page:survival-server/> for systems available there."
