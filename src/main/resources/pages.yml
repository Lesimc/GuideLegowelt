# MiniMessage formatting is supported in titles, summaries, content, and a
# configured background glyph. Set wiki.background to false to disable the
# background for the entire guide.
# Use <page:page-id/> for a link labeled with the target title, or use
# <page:page-id>custom label</page> when the link needs different text.
# Page IDs are used by /wiki <page> and must contain only lowercase letters,
# numbers, underscores, and hyphens. Pages with a parent are listed on that
# parent page instead of in the main table of contents.
# Page summaries may be blank or omitted. Page content may be an empty list or
# omitted when a page should display only its title, background, or images.
wiki:
  title: "<bold><u>LegoWelt Wiki</u></bold>"
  introduction: "Select a topic. Blue underlined terms open related wiki pages."
  background: !!bool "false"
  columns: !!int "3"
pages:
  getting-started:
    title: "Getting Started"
    summary: "Start with the server guides, rules, and gameplay systems."
    content:
      - "Welcome to LegoWelt!"
      - "Read the <page:server-rules/>, then choose the <page:survival-server/> or <page:mining-server/> guide."
      - "The <page:wiki-commands/> page lists the available guide commands and direct-page syntax."
      - "Browse <page:features/>, <page:augments/>, <page:minerals/>, and <page:warps/> for the custom LegoWelt systems."
      - "<b><u>Server links:</u></b>"
      - "<b><blue><u><click:open_url:https://www.legowelt.net/map>BlueMap</click></u></blue></b>"
      - "<blue><b><u><click:open_url:https://www.legowelt.net>Our Website</click></u></b></blue>"
      - "<blue><b><u><click:open_url:https://www.patreon.com/legowelt>Patreon</click></u></b></blue> - Thank you for helping run the server!"
  server-rules:
    title: "Server Rules"
    summary: "Respect other players, their builds, and the shared world."
    content:
      - "<b><u>The three important rules</u></b>"
      - "<underlined>1. Be respectful to other players and the environment.</underlined>"
      - "Do not destroy or build in another player base or in an area they intend to use."
      - "Do not damage the world or environment without a good reason."
      - "<underlined>2. No griefing, trespassing, or stealing.</underlined>"
      - "Do not take items from another player unless you share that storage, base, or project."
      - "Do not operate unfamiliar redstone builds without permission; complex mechanisms are easy to damage."
      - "<underlined>3. Use common sense.</underlined>"
      - "Before acting, consider whether it harms another player's experience or creates an unfair advantage."
  wiki-commands:
    parent: "getting-started"
    title: "Wiki Commands"
    summary: "Open, navigate, and administrate the in-game guide."
    content:
      - "<bold>/wiki</bold> - Open the table of contents."
      - "<bold>/wiki page-id</bold> - Open a topic directly."
      - "<bold>Examples:</bold> <page:features>/wiki features</page>, <page:augments>/wiki augments</page>, and <page:mining-server>/wiki mining-server</page>."
    background: !!bool "false"
  minerals:
    parent: "features"
    title: "Minerals"
    summary: "Find rare mineral drops and learn how they are used."
    content:
      - "<page:minerals/> are extra drops obtained with a pickaxe on the <page:mining-server/>."
      - "Each mineral has a matching source block. Stone and deepslate also have a small chance to drop a random mineral."
      - "Minerals normally drop at Rare quality, with a 1 in 64 chance for a successful drop to become Epic."
      - "Open the <page:mineral-chart/> for every mineral-to-block mapping."
      - "Minerals are used by <page:custom-crafting/> recipes, including recipes for <page:augments/>."
      - "Matching <page:augment-miners/> improve mineral drops. For example, <page:augment-ruby-miner>Ruby Miner</page> is the miner augment for redstone ore."
      - "See <page:feature-toggles/> for the current toggle command status."
  mineral-chart:
    title: "Mineral Chart"
    summary: "View minerals and where they can be found."
    parent: "minerals"
    background: !!bool "false"
    content: []
    images:
      - glyphs:
          - "<font:guidelegowelt:wiki>\uE010\uE011</font>"
          - "<font:guidelegowelt:wiki>\uE012\uE013</font>"
        width: !!int "464"
        height: !!int "414"
  augments:
    title: "Augments"
    summary: "Apply limited-use upgrades to compatible equipment."
    content:
      - "Place compatible equipment in the first anvil slot and an enchanted Augment Book in the second slot to apply its supported augments at no level cost."
      - "Combining the same augment and level adds the book durability to the existing augment, up to its maximum."
      - "Augment lore shows the level and remaining durability. An augment is removed when its durability reaches zero."
      - "Craftable augments use <page:minerals/> or rare <page:sickles-and-farmables>Farmables</page>. Other books can come from <page:custom-loot-tables>Custom Loot</page> and augment traders."
      - "Browse the complete catalog through <page:augment-equipment/>, <page:augment-farmers/>, <page:augment-miners/>, and <page:shulker-storage/>."
      - "See <page:custom-crafting/> for book recycling and self-augment upgrades."
  augment-equipment:
    parent: "augments"
    title: "Equipment Augments"
    summary: "Browse equipment augments by item type and purpose."
    content:
      - "Each augment page lists compatible equipment, limits, durability, and behavior."
  augment-telepathy:
    parent: "augment-equipment"
    title: "Augment: Telepathy"
    summary: "Routes block drops into storage and then your inventory."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Diamond or netherite pickaxes, shovels, axes, and hoes; also shears."
      - "<bold><underlined>Effect:</underlined></bold> Broken block drops first enter matching Collector shulkers, then empty player-inventory space. Anything that does not fit remains as a world drop."
      - "<bold><underlined>Maximum durability:</underlined></bold> 90,000"
      - "<bold><underlined>Durability use:</underlined></bold> 1 when at least one drop is inserted."
      - "Related: <page:shulker-storage/> and <page:custom-crafting/>."
  augment-durable:
    parent: "augment-equipment"
    title: "Augment: Durable"
    summary: "Prevents item damage by spending augment durability."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Diamond and netherite tools, shears, flint and steel, brushes, fishing rods, and carrot or warped-fungus sticks."
      - "<bold><underlined>Effect:</underlined></bold> Cancels normal durability damage and spends Durable durability instead."
      - "<bold><underlined>Maximum durability:</underlined></bold> 450,000"
      - "<bold><underlined>Durability use:</underlined></bold> 1 per damage event for items with at least 1,000 base durability; 10 for lower-durability items."
      - "Related: <page:augments/> and <page:custom-crafting/>."
  augment-eff-7:
    parent: "augment-equipment"
    title: "Augment: Efficiency"
    summary: "Temporarily applies Efficiency VII to supported tools."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Diamond or netherite pickaxes, shovels, axes, and hoes; also shears."
      - "<bold><underlined>Effect:</underlined></bold> Saves the previous Efficiency enchantment and applies Efficiency VII. The previous level is restored when the augment expires."
      - "<bold><underlined>Maximum durability:</underlined></bold> 60,000"
      - "<bold><underlined>Durability use:</underlined></bold> 1 for each broken block."
      - "Related: <page:augment-excavate>Excavate</page>, <page:augment-vein-miner>Vein Miner</page>, and <page:custom-crafting/>."
  augment-fortune-4:
    parent: "augment-equipment"
    title: "Augment: Fortune"
    summary: "Temporarily applies Fortune IV to supported tools."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Diamond or netherite pickaxes, shovels, axes, and hoes; also shears."
      - "<bold><underlined>Effect:</underlined></bold> Saves the previous Fortune enchantment and applies the augment level. Standard recipes create Fortune IV books."
      - "<bold><underlined>Maximum durability:</underlined></bold> 400"
      - "<bold><underlined>Durability use:</underlined></bold> 1 for each broken block."
      - "Related: <page:custom-crafting/>."
  augment-excavate:
    parent: "augment-equipment"
    title: "Augment: Excavate"
    summary: "Breaks a plane or cube of blocks around the target."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Diamond or netherite pickaxes, shovels, axes, and hoes; also shears."
      - "<bold><underlined>Level 1:</underlined></bold> Breaks a 3 x 3 plane aligned to the face being mined."
      - "<bold><underlined>Level 2 :</underlined></bold> Breaks a 3 x 3 x 3 cube around the target."
      - "<bold><underlined>Limits:</underlined></bold> Skips blocks the tool cannot effectively break and does not include obsidian unless the original target is obsidian."
      - "<bold><underlined>Maximum level:</underlined></bold> 2"
      - "<bold><underlined>Maximum durability:</underlined></bold> 8,000"
      - "Discovered ores can also trigger <page:augment-vein-miner>Vein Miner</page>. See <page:custom-crafting/> for recipes."
  augment-vein-miner:
    parent: "augment-equipment"
    title: "Augment: Vein Miner"
    summary: "Breaks connected blocks from the same ore family."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Diamond or netherite pickaxes."
      - "<bold><underlined>Effect:</underlined></bold> Breaks connected blocks from the target ore family, including diagonal connections. Raw ore blocks are included with their matching ore."
      - "<bold><underlined>Maximum durability:</underlined></bold> 30,000"
      - "<bold><underlined>Durability use:</underlined></bold> 1 for each additional ore block broken."
      - "Works with ores exposed by <page:augment-excavate>Excavate</page>. Related: <page:minerals/> and <page:custom-crafting/>."
  augment-infinity:
    parent: "augment-equipment"
    title: "Augment: Infinity"
    summary: "Applies the vanilla Infinity enchantment to a bow."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Bows."
      - "<bold><underlined>Effect:</underlined></bold> Adds the vanilla Infinity enchantment while the augment remains active. Even if the bow already has the mending enchantment."
      - "<bold><underlined>Maximum durability:</underlined></bold> 90,000"
      - "<bold><underlined>Durability use:</underlined></bold> 1 each time the augmented bow fires."
      - "Related: <page:augments/> and <page:custom-crafting/>."
  augment-compress:
    parent: "augment-equipment"
    title: "Augment: Compress"
    summary: "Converts supported mining drops into storage blocks."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Diamond or netherite pickaxes."
      - "<bold><underlined>Effect:</underlined></bold> Combines groups of nine supported drops into blocks while remembering per-player remainders."
      - "<bold><underlined>Supported drops:</underlined></bold> Coal, raw iron, raw copper, raw gold, redstone, emeralds, lapis lazuli, diamonds, and gold nuggets."
      - "<bold><underlined>Maximum durability:</underlined></bold> 90,000"
      - "<bold><underlined>Durability use:</underlined></bold> 1 for a block-drop event containing at least one supported item."
      - "Compression runs before <page:augment-telepathy>Telepathy</page>. Related: <page:custom-crafting/>."
  augment-replant:
    parent: "augment-equipment"
    title: "Augment: Replant"
    summary: "Replants supported crops after a valid sickle harvest."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Custom diamond or netherite sickles."
      - "Effect: Replants wheat, potatoes, carrots, beetroot, nether wart, or cocoa after harvest."
      - "The seed or crop is taken first from the block drops, then a <page:augment-restocker>Restocker</page> shulker, then the player inventory. Replanting fails if no matching item is available or the block is no longer empty."
      - "Limits: Level 1; maximum durability 90,000; Uncommon."
      - "Durability use: None in the current version."
      - "Related: <page:sickles-and-farmables/> and <page:augment-farmers/>."
  augment-farmers:
    parent: "augments"
    title: "Farmer Augments"
    summary: "Improve one matching farmable and the normal drops from its crop."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Custom diamond or netherite sickles."
      - "Each Farmer augment matches one crop. On a directly harvested eligible block, it improves the Rare farmable roll and can multiply normal crop drops."
      - "<bold><underlined>Farmable chance:</underlined></bold> The base Rare chance is 1 in 128. The bonus grows with level and doubles that chance at level 10; a successful Rare roll has a 1 in 64 chance to become Epic."
      - "<bold><underlined>Normal drops:</underlined></bold> Each level adds a 20% chance for one extra complete set. Level 5 always doubles normal drops; level 10 always triples them."
      - "<bold><underlined>Limits:</underlined></bold> Levels 1-10, maximum durability 10,000, Uncommon, and 1 durability used for each eligible harvest. One item can hold at most five Farmer or Miner augments in total."
      - "Ageable crops must be fully grown. See <page:augment-replant>Replant</page> for supported automatic replanting."
      - "Crops: <page:augment-wheat-farmer>Wheat</page>, <page:augment-potato-farmer>Potato</page>, <page:augment-carrot-farmer>Carrot</page>, <page:augment-beetroot-farmer>Beetroot</page>, <page:augment-melon-farmer>Melon</page>, and <page:augment-pumpkin-farmer>Pumpkin</page>."
      - "Plants: <page:augment-sweet-berries-farmer>Sweet Berries</page>, <page:augment-cactus-farmer>Cactus</page>, <page:augment-cactus-flower-farmer>Cactus Flower</page>, <page:augment-sugar-cane-farmer>Sugar Cane</page>, and <page:augment-bamboo-farmer>Bamboo</page>."
      - "Special crops: <page:augment-nether-wart-farmer>Nether Wart</page>, <page:augment-torchflower-farmer>Torchflower</page>, and <page:augment-cocoa-beans-farmer>Cocoa Beans</page>."
      - "Related: <page:sickles-and-farmables/> and <page:custom-crafting/>."
  augment-wheat-farmer:
    parent: "augment-farmers"
    title: "Augment: Wheat Farmer"
    summary: "Improves farmable rarity and normal drops from mature wheat."
    content:
      - "Matching crop: Fully grown Wheat."
      - "Base Rare wheat chance: 1 in 128 per eligible harvest."
      - "Wheat Farmer follows the shared level 1-10 rules on the <page:augment-farmers/> page and supports <page:augment-replant>Replant</page> with wheat seeds."
  augment-potato-farmer:
    parent: "augment-farmers"
    title: "Augment: Potato Farmer"
