  augment-miners:
    parent: "augments"
    title: "Miner Augments"
    summary: "Improve one matching mineral and the normal drops from its source blocks."
    content:
      - "<bold><underlined>Applies to:</underlined></bold> Diamond or netherite pickaxes."
      - "Each Miner augment matches one <page:minerals>Mineral</page>. On a directly mined, unaltered matching block, it improves that mineral roll and can multiply the normal block drops."
      - "<bold><underlined>Mineral chance:</underlined></bold> The bonus grows with level and doubles the matching mineral base chance at level 10."
      - "<bold><underlined>Normal drops:</underlined></bold> Each level adds a 20% chance for one extra complete set. Level 5 always doubles normal drops; level 10 always triples them."
      - "<bold><underlined>Limits:</underlined></bold> Levels 1-10, maximum durability 10,000, and 1 durability used for each eligible block. One item can hold at most five Miner or Farmer augments in total."
      - "Stone and deepslate first select a random mineral and then make a 1 in 500 roll; only the Miner augment matching the selected mineral affects that roll."
      - "<bold><underlined>Overworld stone minerals:</underlined></bold> <page:augment-iolite-miner>Iolite</page>, <page:augment-moonstone-miner>Moonstone</page>, <page:augment-limestone-miner>Limestone</page>, <page:augment-carnelian-miner>Carnelian</page>, <page:augment-selenite-miner>Selenite</page>, and <page:augment-asphalite-miner>Asphalite</page>."
      - "<bold><underlined>Overworld ore minerals:</underlined></bold> <page:augment-onyx-miner>Onyx</page>, <page:augment-galena-miner>Galena</page>, <page:augment-bauxite-miner>Bauxite</page>, <page:augment-tiger-eye-miner>Tiger Eye</page>, <page:augment-ruby-miner>Ruby (Redstone)</page>, <page:augment-jade-miner>Jade</page>, and <page:augment-azurite-miner>Azurite</page>."
      - "<bold><underlined>Nether minerals:</underlined></bold> <page:augment-amber-miner>Amber</page>, <page:augment-pyrite-miner>Pyrite</page>, and <page:augment-rose-quartz-miner>Rose Quartz</page>."
      - "Use <page:custom-crafting/> to upgrade identical self-augment books."
  augment-iolite-miner:
    parent: "augment-miners"
    title: "Augment: Iolite Miner"
    summary: "Improves Iolite drops from amethyst blocks and clusters."
    content:
      - "Matching blocks: Amethyst Block and Amethyst Cluster."
      - "Base Iolite chance: 1 in 40 per eligible block."
      - "The Iolite Miner bonus and normal-drop multiplier follow the shared level 1-10 rules on the <page:augment-miners/> page."
